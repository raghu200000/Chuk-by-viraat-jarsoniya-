name: Build CHUK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir -p project
          unzip -q CHUK_by_Viraat_Jarsoniya_Android_Ready.zip -d project

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find project -name pubspec.yaml -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Upgrade Gradle
        run: |
          find project -name gradle-wrapper.properties -exec sed -i 's/gradle-8\.7-bin\.zip/gradle-8.14-bin.zip/g' {} \;
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHUK-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
